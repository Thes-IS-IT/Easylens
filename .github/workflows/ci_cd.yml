name: EasyLens Automated CI/CD & Docker Package Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Analysis & Unit Tests
  # -------------------------------------------------------------
  analyze_and_test:
    name: 🔍 Analyze & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Mock .env File
        run: touch .env

      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter Unit Tests
        run: flutter test

  # -------------------------------------------------------------
  # Job 2: Docker Build, Health Verification & GHCR Package Publish
  # -------------------------------------------------------------
  docker_build_and_publish:
    name: 🐳 Docker Build, Verify & Publish Package to GHCR
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image Locally for Health Check
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: easylens:test
          load: true

      - name: Test Docker Container Health
        run: |
          docker run -d -p 8080:80 --name test-easylens easylens:test
          sleep 3
          curl -f http://localhost:8080/ || exit 1
          docker stop test-easylens

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & Push Docker Package Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
