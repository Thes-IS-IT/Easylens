name: EasyLens Automated CI/CD & Docker Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Static Analysis & Unit Tests
  # -------------------------------------------------------------
  analyze_and_test:
    name: 🔍 Analyze & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Mock .env File
        run: touch .env

      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter Unit Tests
        run: flutter test

  # -------------------------------------------------------------
  # Job 2: Docker Build, Verify & Publish to GitHub Packages (GHCR)
  # -------------------------------------------------------------
  docker_build_and_publish:
    name: 🐳 Docker Build, Verify & Publish to GHCR
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image Locally for Health Check
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: easylens-web:test
          load: true

      - name: Test Docker Container Health
        run: |
          docker run -d -p 8080:80 --name test-easylens easylens-web:test
          sleep 5
          curl -f http://localhost:8080/ || exit 1
          docker stop test-easylens

      - name: Build & Push Docker Package to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # -------------------------------------------------------------
  # Job 3: Android APK Automated Build Artifact
  # -------------------------------------------------------------
  build_android:
    name: 📱 Build Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Mock .env File
        run: touch .env

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easylens-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
