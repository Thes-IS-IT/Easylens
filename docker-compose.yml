services:
  easylens-mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easylens_mobile_server
    ports:
      - "8080:80"
    restart: always
    environment:
      - NODE_ENV=production
    volumes:
      - ./build/app/outputs/flutter-apk:/usr/share/nginx/html/downloads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

