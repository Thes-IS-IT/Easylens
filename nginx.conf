server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Defensive Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;

    # APK Downloads
    client_max_body_size 1024M;

    location = /easylens-release.apk {
        try_files /downloads/app-release.apk @github_apk_release;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="easylens-release.apk"';
    }

    location = /easylens-debug.apk {
        try_files /downloads/app-debug.apk @github_apk_release;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="easylens-debug.apk"';
    }

    location @github_apk_release {
        return 302 https://github.com/Thes-IS-IT/Easylens/releases/download/v25.0/app-release.apk;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf|webp|wasm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
